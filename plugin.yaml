schema_version: 1

plugin:
  name: "false-positive-report-plugin"
  description: "Sends e-mail notifications for possible false positives detected by CRS rules."
  long_description: >
    Runs in phase 5 and inspects all logs generated by rules using the `log` action.
    When a possible false positive is detected, it sends an e-mail notification over
    SMTP (with optional TLS), subject to configurable filters by rule ID, GeoIP
    country, source IP address, HTTP request method, server name, request URI, and
    message pattern. Logs are read from memory via the `WEBSERVER_ERROR_LOG`
    variable, so the plugin does not need filesystem access to log files. Requires
    ModSecurity built with Lua support, plus the LuaSocket library (and LuaSec for
    TLS).
  type: "official"
  category: "logging"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
  repository: "https://github.com/coreruleset/false-positive-report-plugin"
  keywords:
    - logging
    - false-positive
    - email
    - smtp
    - notifications
    - reporting
    - geoip

rule_id_range:
  start: 9525000
  end: 9525999

compatibility:
  engines:
    - modsecurity2

configuration:
  file: "plugins/false-positive-report-config.conf"
  variables:
    - name: tx.false-positive-report-plugin_enabled
      type: boolean
      default: 1
      description: "Enables or disables the plugin."

    - name: tx.false-positive-report-plugin_smtp_from
      type: string
      default: ""
      required: true
      description: "E-mail address used as the sender. Must be set for the plugin to work."

    - name: tx.false-positive-report-plugin_smtp_to
      type: string
      default: ""
      required: true
      description: "E-mail address to which notifications are sent. Must be set for the plugin to work."

    - name: tx.false-positive-report-plugin_smtp_cc
      type: indexed
      max_index: 5
      default: ""
      description: "Additional e-mail addresses (up to 5) which receive notifications as CC."

    - name: tx.false-positive-report-plugin_smtp_subject
      type: string
      default: "<server_hostname> - <host_header>: False positive report from CRS"
      description: "Subject of the notification e-mail. Supports the <server_hostname> and <host_header> macros."

    - name: tx.false-positive-report-plugin_smtp_user
      type: string
      default: ""
      description: "Username for SMTP AUTH. Leave empty to not use SMTP authentication."

    - name: tx.false-positive-report-plugin_smtp_password
      type: string
      default: ""
      description: "Password for SMTP AUTH. Leave empty to not use SMTP authentication."

    - name: tx.false-positive-report-plugin_smtp_server
      type: string
      default: "localhost"
      description: "Hostname or IP address of the SMTP server."

    - name: tx.false-positive-report-plugin_smtp_port
      type: integer
      default: 25
      description: "Port of the SMTP server."

    - name: tx.false-positive-report-plugin_smtp_tls
      type: boolean
      default: 0
      description: "Enables TLS communication with the SMTP server. Consider also setting the SMTP port to 465."

    - name: tx.false-positive-report-plugin_smtp_tls_protocol
      type: string
      default: "tlsv1_2"
      description: "TLS protocol to use when SMTP TLS is enabled."

    - name: tx.false-positive-report-plugin_geoip_custom_lookup
      type: boolean
      default: 0
      description: "Disables ModSecurity's built-in GeoIP lookup and uses an externally provided GeoIP country code instead (e.g. from mod_maxminddb)."

    - name: tx.false-positive-report-plugin_geoip_country_code
      type: string
      default: "%{env.geoip_country_code}"
      description: "Variable holding the GeoIP country code, used when custom GeoIP lookups are enabled."

    - name: tx.false-positive-report-plugin_filter_id
      type: string
      default: ""
      description: "Space separated rule IDs to watch for. Leave empty to watch all rule IDs."

    - name: tx.false-positive-report-plugin_filter_geoip
      type: string
      default: ""
      description: "Space separated ISO country codes to watch for. Logs from requests not matching this list are ignored. Leave empty to watch all countries."

    - name: tx.false-positive-report-plugin_filter_ip
      type: string
      default: ""
      description: "Comma separated list of IP addresses to watch for. Logs from requests not matching this list are ignored. Leave empty to watch all IP addresses."

    - name: tx.false-positive-report-plugin_filter_ignore_id
      type: string
      default: "949110 959100 980130 980140"
      description: "Space separated rule IDs to ignore."

    - name: tx.false-positive-report-plugin_filter_ignore_request_method
      type: string
      default: ""
      description: "Space separated HTTP request methods. Logs generated by requests using any of these methods are ignored."

    - name: tx.false-positive-report-plugin_filter_ignore_server_name
      type: indexed
      max_index: 100
      default: ""
      description: "Lua patterns (up to 100) matched against the server name. Logs from requests whose server name matches any pattern are ignored."

    - name: tx.false-positive-report-plugin_filter_ignore_request_uri
      type: indexed
      max_index: 100
      default: ""
      description: "Lua patterns (up to 100) matched against the request URI. Logs from requests whose URI matches any pattern are ignored."

    - name: tx.false-positive-report-plugin_filter_ignore_msg
      type: indexed
      max_index: 100
      default: ""
      description: "Lua patterns (up to 100) matched against the rule message. Logs whose message matches any pattern are ignored."

    - name: tx.false-positive-report-plugin_filter_ignore_pcre_limits_error
      type: boolean
      default: 1
      description: "Ignores 'PCRE limits exceeded' error messages when set to 1."
